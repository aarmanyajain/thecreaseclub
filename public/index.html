<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Crease Club</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #111 0%, #070707 60%);
      color: white;
    }

    /* HERO */
    .hero {
      height: 65vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .hero-content h1 {
      font-size: 44px;
      letter-spacing: 3px;
      margin-bottom: 12px;
      text-shadow: 0 0 25px rgba(255,255,255,0.08);
    }

    .hero-content p {
      color: #9f9f9f;
      font-size: 15px;
      margin-bottom: 26px;
    }

    .hero-btn {
      padding: 12px 26px;
      border-radius: 30px;
      border: 1px solid white;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: 0.25s;
      font-weight: 600;
    }

    .hero-btn:hover {
      background: white;
      color: black;
    }

    /* SECTION */
    .section {
      padding: 40px 20px 60px;
      max-width: 950px;
      margin: auto;
    }

    .section h2 {
      font-size: 24px;
      margin-bottom: 25px;
      text-align: center;
      letter-spacing: 1px;
    }

    /* GRID */
    .grid {
      display: flex;
      justify-content: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    /* CARD */
    .card {
      width: 240px;
      background: linear-gradient(180deg, #141414, #0f0f0f);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid #222;
      transition: 0.25s;
      position: relative;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #333;
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .price {
      font-size: 14px;
      color: #e7e7e7;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .tag {
      font-size: 11px;
      color: #888;
      margin-bottom: 12px;
    }

    .lock {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 12px;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      color: black;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: white;
      color: black;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #ddd;
    }

    .footer {
      text-align: center;
      padding: 30px 20px;
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .card {
        width: 90%;
        max-width: 270px;
      }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>THE CREASE CLUB</h1>
      <p>Premium Motion Wallpapers • Members Only</p>
      <button class="hero-btn" onclick="document.getElementById('products').scrollIntoView()">
        Explore Drops
      </button>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="section" id="products">
    <h2>Video Wallpapers</h2>

    <div class="grid">

      <!-- PRODUCT 1 -->
      <div class="card">
        <div class="lock">🔒</div>
        <div class="badge">₹9</div>
         <img src="https://i.postimg.cc/XY3MXd8y/Screenshot-2026-02-06-12-35-19-15-1c337646f29875672b5a61192b9010f9-jpg.jpg">
        <h3>Wallpaper 01</h3>
        <div class="tag">Instant unlock after payment</div>
        <button onclick="pay('wp1')">Unlock Now</button>
      </div>

      <!-- PRODUCT 2 -->
      <div class="card">
        <div class="lock">🔒</div>
        <div class="badge">₹9</div>
        <img src="https://i.postimg.cc/1RJVvrgf/Screenshot-2026-02-06-12-36-10-93-99c04817c0de5652397fc8b56c3b3817-jpg.jpg">
        <h3>Wallpaper 02</h3>
        <div class="tag">Instant unlock after payment</div>
        <button onclick="pay('wp2')">Unlock Now</button>
      </div>

    </div>
  </section>

  <div class="footer">
    © The Crease Club • Digital Drops
  </div>

<script>
async function pay(productId) {
  const res = await fetch("http://localhost:5000/create-order", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ productId })
  });

  const order = await res.json();

  const options = {
    key: "rzp_test_SClIWfk4neJjHH",
    amount: order.amount,
    currency: "INR",
    name: "The Crease Club",
    description: "Unlock Video Wallpaper",
    order_id: order.id,

    handler: function () {
      if (productId === "wp1") {
        window.location.href = "https://drive.google.com/uc?export=download&id=1fSo63TknWfDtHBtejEjW9NhOjUwS9QFC";
      } else {
        window.location.href = "https://drive.google.com/uc?export=download&id=19DUGSpcupPNzEkMNUl3RKYK9LIJ_EgW1";
      }
    },

    theme: {
      color: "#ffffff"
    }
  };

  const rzp = new Razorpay(options);
  rzp.open();
}
</script>

</body>
</html>
